project:
  title: "The Silent Owl: GF180MCU Wide-Band LNA"
  team: "A38 The Silent Owl"
  discord: "ghaithalsabagh"
  description: "GF180MCU low-noise amplifier with RF input matching, common-gate/common-source gain stages, and external analog bias controls."
  lvs_config: "lvs_config.json"
  gf_def_ready: false           # Set true only after GF padframe/DEF preparation is verified
  ws_def_ready: false           # Set true only after Wafer Space padframe/DEF preparation is verified
  drc_ready: true               # klayout/lna_core_parts_filled.gds: KLayout + Magic DRC, 0 violations
  lvs_ready: true               # same GDS vs xschem/lna_core_parts_lvs.spice: 28 devices / 22 nets, match
  export_control: "docs/Export_Control_GF_Rev8.2.pdf"   # Required export control document


# Pin interface of top cell lna_core_parts (klayout/lna_core_parts_filled.gds).
# The pads are listed in physical order: first the west (left) edge bottom to top, then the
# north (top) edge left to right. See PIN_NOTE_FOR_INTEGRATION.md for the pad coordinates and
# for the request to keep the names and the GSG arrangement unchanged.
#
# vss_l_1..6 and vss_t_7..9 are the 9 ground pads of the net vss, vdd_t_1..3 the 3 supply pads
# of the net vdd (l = west edge, t = north edge; the ground pads are numbered continuously
# around the two edges). open_dummy_lvs is an LVS-only label on the open end of the open
# structure (no pad), so it is not listed.

pins:
  # ---- west (left) edge, bottom to top ----
  - name: vss_l_1
    io_type: ground

  - name: deemb_2r
    io_type: analog

  - name: vss_l_2
    io_type: ground

  - name: deemb_r
    io_type: analog

  - name: vss_l_3
    io_type: ground

  - name: deemb_0p5r
    io_type: analog

  - name: vss_l_4
    io_type: ground

  - name: rf_in_pad
    io_type: analog

  - name: vss_l_5
    io_type: ground

  - name: deemb_s
    io_type: analog

  - name: vss_l_6
    io_type: ground

  # ---- north (top) edge, left to right ----
  - name: vbias_cg
    io_type: analog

  - name: vdd_t_1
    io_type: power

  - name: vbias_cs
    io_type: analog

  - name: vdd_t_2
    io_type: power

  - name: vbias_cas
    io_type: analog

  - name: vss_t_7
    io_type: ground

  - name: rf_out_pad
    io_type: analog

  - name: vss_t_8
    io_type: ground

  - name: deemb_o
    io_type: analog

  - name: vss_t_9
    io_type: ground

  - name: vdd_t_3
    io_type: power
